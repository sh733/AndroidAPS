name: AAPS CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > aaps.jks

      - name: Fix Ru Translation Error
        # Удаляем файл с ошибкой в Omnipod, чтобы сборка не падала
        run: find . -name "values-ru-rRU.xml" -exec rm -f {} +

      - name: Build with Gradle
        run: ./gradlew assembleFullRelease -x test
        env:
          KEYSTORE_FILE: aaps.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAPS-Release
          path: "app/build/outputs/apk/full/release/*.apk"

name: AAPS CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > aaps.jks

      - name: Force Fix Translation Errors
        run: |
          find . -type d -name "values-ru*" -exec rm -rf {} +
          # Маскируем изменения, чтобы пройти проверку "uncommitted changes"
          git config --global user.email "build@aaps.ci"
          git config --global user.name "AAPS CI"
          git add .
          git commit -m "Fix translations for build" || echo "No changes to commit"

      - name: Build Phone APK
        # Собираем ТОЛЬКО телефон (app), игнорируя тесты и часы
        run: ./gradlew :app:assembleFullRelease -x test
        env:
          KEYSTORE_FILE: ../aaps.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Phone Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAPS-Phone-Ready
          path: "app/build/outputs/apk/full/release/*.apk"

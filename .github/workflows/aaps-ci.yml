name: AAPS CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > aaps.jks

      - name: Force Fix Translation Errors
        # Удаляем все папки с русским переводом, где есть ошибки в коде
        run: |
          find . -type d -name "values-ru*" -exec rm -rf {} +

      - name: Build with Gradle
        # Собираем с игнорированием ошибок ресурсов
        run: ./gradlew assembleFullRelease -x test
        env:
          KEYSTORE_FILE: aaps.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAPS-Release
          path: "**/build/outputs/apk/full/release/*.apk"

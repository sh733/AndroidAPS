name: AAPS CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        # Кладем ключ в корень проекта
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > aaps.jks

      - name: Force Fix Translation Errors
        run: |
          find . -type d -name "values-ru*" -exec rm -rf {} +
          git config --global user.email "build@aaps.ci"
          git config --global user.name "AAPS CI"
          git add .
          git commit -m "Fix translations" || echo "No changes"

      - name: Build Phone APK
        # Принудительно передаем параметры ключа прямо в команду сборки
        run: |
          ./gradlew :app:assembleFullRelease -x test \
          -Pandroid.injected.signing.store.file=$(pwd)/aaps.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Phone Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidAPS-Phone-Signed
          # Берем любой APK из папки release, чтобы не ошибиться с путем
          path: "app/build/outputs/apk/full/release/*.apk"
